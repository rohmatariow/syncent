# SynCent — Production (all-in-one Docker)
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncent
      POSTGRES_USER: syncent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://syncent:${DB_PASSWORD:-changeme}@db:5432/syncent?sslmode=disable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:

networks:
  internal:
