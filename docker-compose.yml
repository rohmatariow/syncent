services:
  db:
    image: postgres:16-alpine
    container_name: syncent-db
    environment:
      POSTGRES_DB: syncent
      POSTGRES_USER: syncent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_go:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_go:
