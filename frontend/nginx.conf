server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|ico|svg|woff|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { expires -1; add_header Cache-Control "no-store"; }
}
